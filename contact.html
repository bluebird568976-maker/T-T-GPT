<section class="page-hero"><div class="container"><p class="section-index">03 / CONTACT</p><h1>お問い合わせ</h1><p>ご相談・ご質問はこちらから。</p></div></section>
<section class="contact-section section"><div class="container contact-container"><div class="contact-lead"><p>コンサルティングに関するご相談やご質問などは、下記のフォームよりお気軽にお問い合わせください。内容を確認次第、担当者よりご連絡させていただきます。</p></div><form class="contact-form contact-form-box" id="contact-form"><label><span class="form-label">貴社名</span><input name="company" type="text" autocomplete="organization" placeholder="例）株式会社○○"></label><label><span class="form-label">お名前 <em>必須</em></span><input name="name" type="text" autocomplete="name" placeholder="例）山田 太郎" required></label><label><span class="form-label">メールアドレス <em>必須</em></span><input name="email" type="email" autocomplete="email" placeholder="例）info@example.com" required></label><label><span class="form-label">お問い合わせ内容 <em>必須</em></span><textarea name="message" rows="9" placeholder="ご相談内容をご記入ください" required></textarea></label><button class="button button-dark contact-submit" type="submit">送信する</button><p class="form-note">※現在は入力確認用です。実際の送信には送信先サービスの設定が必要です。</p></form></div></section>
</main>
