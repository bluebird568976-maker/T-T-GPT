<section class="contact-section section"><div class="container contact-container"><div class="contact-lead"><p class="jp-flow"><span class="jp-phrase">コンサルティングに関する</span><wbr><span class="jp-phrase">ご相談やご質問などは、</span><wbr><span class="jp-phrase">下記のフォームより</span><wbr><span class="jp-phrase">お気軽に</span><wbr><span class="jp-phrase">お問い合わせください。</span><wbr><span class="jp-phrase">内容を確認次第、</span><wbr><span class="jp-phrase">担当者より</span><wbr><span class="jp-phrase">ご連絡させていただきます。</span></p></div><form class="contact-form contact-form-box" id="contact-form"><label><span class="form-label">貴社名</span><input name="company" type="text" autocomplete="organization" placeholder="例）株式会社○○"></label><label><span class="form-label">お名前 <em>必須</em></span><input name="name" type="text" autocomplete="name" placeholder="例）山田 太郎" required></label><label><span class="form-label">メールアドレス <em>必須</em></span><input name="email" type="email" autocomplete="email" placeholder="例）info@example.com" required></label><label><span class="form-label">お問い合わせ内容 <em>必須</em></span><textarea name="message" rows="9" placeholder="ご相談内容をご記入ください" required></textarea></label><button class="button button-dark contact-submit" type="submit">送信する</button><p class="form-note jp-flow"><span class="jp-phrase">※現在は入力確認用です。</span><wbr><span class="jp-phrase">実際の送信には</span><wbr><span class="jp-phrase">送信先サービスの設定が必要です。</span></p></form></div></section>
